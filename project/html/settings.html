<!doctype html>
<html lang="en" class="h-100">
  <head>
    <title>MemeMory</title>

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl"
      crossorigin="anonymous"
    />

    <!--- Custom CSS-->
    <!--- identical to index.html --->
    <link rel="stylesheet" href="/static/styles/index.css" />
    <link rel="stylesheet" href="/static/styles/theme.css" />

    <!--- Icons --->
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="/static/images/favicon/favicon.ico"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.0/font/bootstrap-icons.css"
    />

    <!--- Font --->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="d-flex flex-column h-100">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-3">
          <div class="row displ-content">
            <div class="col-6 col-md-4 order-1 order-md-1">
              <div class="navbar-brand active">
                <a href="/">
                  <img
                    src="/static/images/logo.png"
                    alt="logo"
                    class="img-fluid logo"
                  />
                </a>
              </div>
            </div>
            <div
              class="col-12 col-md-4 text-center order-3 order-md-2 pt-5 pb-3 pt-md-0 pb-md-0"
            >
              <a href="/lobby" class="mm-btn mm-btn-lg play-button"><i class="bi bi-play-fill"></i> Play</a>
            </div>
            <div class="col-6 col-md-4 fw-light order-2 order-md-3">
              <div class="d-flex text-light pl-xl-5">
                <div class="ms-auto profile-menu" id="profileMenu">
                  <button type="button" class="profile-trigger" id="profileTrigger" aria-haspopup="true" aria-expanded="false">
                    <span id="profileAvatar" class="mm-avatar sm"></span>
                    <span class="profile-name" id="username"></span>
                    <i class="bi bi-chevron-down profile-caret"></i>
                  </button>
                  <div class="profile-dropdown" id="profileDropdown" hidden>
                    <div class="profile-head">
                      <span id="profileAvatarLarge" class="mm-avatar"></span>
                      <div class="overflow-hidden">
                        <div class="profile-head-name" id="profileName"></div>
                        <div class="mm-muted small">Signed in</div>
                      </div>
                    </div>
                    <a href="/lobby" class="profile-item"><i class="bi bi-controller"></i> Play</a>
                    <a href="/home" class="profile-item"><i class="bi bi-trophy"></i> Scoreboard</a>
                    <a href="/user" class="profile-item"><i class="bi bi-bar-chart-line"></i> Profile</a>
                    <a href="/settings" class="profile-item"><i class="bi bi-gear"></i> Settings</a>
                    <div class="profile-divider"></div>
                    <button type="button" class="profile-item danger" id="logoutButton">
                      <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="page settings">
      <h1 class="page-title mb-4">Settings</h1>

      <section class="panel mb-4">
        <h2 class="panel-title"><i class="bi bi-shield-lock"></i> Change password</h2>
        <form action="#" onsubmit="changePassword(); return false;">
          <div class="mm-field">
            <label for="oldPassword">Current password</label>
            <input id="oldPassword" type="password" class="mm-input" placeholder="••••••••" autocomplete="current-password" required />
            <label class="visually-hidden text-danger" id="oldPasswordLabel">Wrong Password</label>
          </div>
          <div class="mm-field">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" class="mm-input" placeholder="••••••••" autocomplete="new-password" required />
            <label class="visually-hidden text-danger" id="newPasswordLabel">Password is too weak. (Minimum of 8 characters with one letter, one number and one special character)</label>
          </div>
          <div class="mm-field">
            <label for="repeatNewPassword">Repeat new password</label>
            <input id="repeatNewPassword" type="password" class="mm-input" placeholder="••••••••" autocomplete="new-password" required />
            <label class="visually-hidden text-danger" id="repeatNewPasswordLabel">Password is not identical.</label>
          </div>
          <button type="submit" class="mm-btn mm-btn-primary w-100 mt-2" id="buttonNewPassword">
            Set New Password
          </button>
        </form>
      </section>

      <section class="panel danger-zone">
        <h2 class="panel-title"><i class="bi bi-exclamation-triangle"></i> Danger zone</h2>
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
          <p class="mm-muted mb-0 me-3">Your account and all statistics will be deleted permanently.</p>
          <button type="button" class="mm-btn mm-btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
            <i class="bi bi-trash"></i> Delete Account
          </button>
        </div>
      </section>

      <!-- Confirm dialog -->
      <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content mm-modal">
            <div class="modal-body text-center p-4">
              <div class="fs-1 mb-2">⚠️</div>
              <h3 class="fs-5 fw-semibold" id="deleteModalLabel">Delete your account?</h3>
              <p class="mm-muted mb-0">Your account will be deleted permanently and all data will be lost.</p>
            </div>
            <div class="modal-footer justify-content-between">
              <button type="button" class="mm-btn" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="mm-btn mm-btn-danger" onclick="deleteUser(); return false;">
                <i class="bi bi-trash"></i> Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <div class="container-fluid pt-5">
        <nav class="d-flex justify-content-center text-center">
          <div>
            <a
              class="nav-link text-light px-4 py-2"
              href="https://de.wikipedia.org/wiki/Impressum"
              >Impressum</a
            >
          </div>
          <div>
            <a
              class="nav-link text-light px-4 py-2"
              href="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
              >don't click</a
            >
          </div>
        </nav>
      </div>
    </footer>

    <!--- JavaScript --->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0"
      crossorigin="anonymous"
    ></script>
    <!--- Custom JS --->
    <script src="/static/scripts/ui.js"></script>
    <script src="/static/scripts/nav.js"></script>
    <script src="/static/scripts/settings.js"></script>
  </body>
</html>
