<!doctype html>
<html lang="en" class="min-h-100">

<head>
    <title>MemeMory</title>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">

    <!--- Custom CSS-->
    <!--- identical to index.html --->
    <link rel="stylesheet" href="/static/styles/index.css">
    <link rel="stylesheet" href="/static/styles/theme.css">
    <link rel="stylesheet" href="/static/styles/play.css">
    <link rel="stylesheet" href="/static/styles/room.css">

    <!--- Icons --->
    <link rel="shortcut icon" type="image/x-icon" href="/static/images/favicon/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.0/font/bootstrap-icons.css">

    <!--- Font --->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;800&display=swap" rel="stylesheet">
</head>

<body class="d-flex flex-column min-h-100">

    <div id="cardModal" class="modal" onclick="closeCardModal()">
        <span class="close">&times;</span>
        <img class="modal-content mx-auto" id="imgModal">
    </div>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid px-0 px-sm-3">
                <div class="row displ-content">
                    <div class="col-6">
                        <div class="navbar-brand active">
                            <a href="/">
                                <img src="/static/images/logo.png" alt="logo" class="img-fluid logo">
                            </a>
                        </div>
                    </div>
                    <div class="col-6 d-flex justify-content-end align-items-center">
                        <div class="ms-auto profile-menu" id="profileMenu">
                  <button type="button" class="profile-trigger" id="profileTrigger" aria-haspopup="true" aria-expanded="false">
                    <span id="profileAvatar" class="mm-avatar sm"></span>
                    <span class="profile-name" id="username"></span>
                    <i class="bi bi-chevron-down profile-caret"></i>
                  </button>
                  <div class="profile-dropdown" id="profileDropdown" hidden>
                    <div class="profile-head">
                      <span id="profileAvatarLarge" class="mm-avatar"></span>
                      <div class="overflow-hidden">
                        <div class="profile-head-name" id="profileName"></div>
                        <div class="mm-muted small">Signed in</div>
                      </div>
                    </div>
                    <a href="/lobby" class="profile-item"><i class="bi bi-controller"></i> Play</a>
                    <a href="/home" class="profile-item"><i class="bi bi-trophy"></i> Scoreboard</a>
                    <a href="/user" class="profile-item"><i class="bi bi-bar-chart-line"></i> Profile</a>
                    <a href="/settings" class="profile-item"><i class="bi bi-gear"></i> Settings</a>
                    <div class="profile-divider"></div>
                    <button type="button" class="profile-item danger" id="logoutButton">
                      <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                  </div>
                </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="room-page">
        <div class="room-layout">
            <div class="room-main">
                <div id="board" class="board">
                    <div class="memory-grid" id="memoryTable"></div>
                </div>
            </div>

            <aside class="room-side">
                <div class="mm-card side-card">
                    <div class="side-head">
                        <span class="fw-semibold"><i class="bi bi-person me-2"></i>Singleplayer</span>
                        <span id="pairsLeft" class="mm-badge">33 pairs left</span>
                    </div>
                    <div class="player-list">
                        <div class="player-item" id="user1Item">
                            <span id="user1Avatar" class="mm-avatar"></span>
                            <div class="player-info">
                                <div class="player-name">
                                    <span class="player-name-text" id="user1Username"></span>
                                    <span class="player-tag">You</span>
                                    <span id="surrenderSlot"></span>
                                </div>
                            </div>
                            <div class="player-points" id="user1Score">0</div>
                        </div>
                        <div class="player-item" id="user2Item">
                            <img id="botAvatar" class="bot-avatar-small" src="/static/images/avatar_easy_200.png" alt="" width="36" height="36">
                            <div class="player-info">
                                <div class="player-name"><span class="player-name-text" id="user2Username"></span></div>
                                <div class="player-sub">Bot</div>
                            </div>
                            <div class="player-points" id="user2Score">0</div>
                        </div>
                    </div>
                    <div class="side-actions">
                        <!--- After the game --->
                        <button type="button" id="rematchButton" class="mm-btn mm-btn-primary w-100" hidden>
                            <i class="bi bi-arrow-repeat"></i> Rematch
                        </button>
                        <a href="/lobby" id="lobbyButton" class="mm-btn w-100" hidden>
                            <i class="bi bi-house"></i> Back to lobby
                        </a>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!--- Game over --->
    <div id="resultOverlay" class="overlay-screen" hidden>
        <div class="result-box mm-card">
            <div class="result-trophy-icon"><i class="bi bi-trophy-fill"></i></div>
            <h2 id="resultTitle" class="result-title"></h2>
            <p id="resultText" class="mm-muted mb-4"></p>
            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <button type="button" id="resultBoardButton" class="mm-btn">
                    <i class="bi bi-grid-3x3-gap"></i> Show board
                </button>
                <a href="/lobby" class="mm-btn">
                    <i class="bi bi-house"></i> Back to lobby
                </a>
                <button type="button" id="resultRematchButton" class="mm-btn mm-btn-primary result-rematch">
                    <i class="bi bi-arrow-repeat"></i> Rematch
                </button>
            </div>
        </div>
    </div>

    <!--- JavaScript --->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous">
    </script>
    <!--- Custom JS --->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/static/scripts/ui.js"></script>
    <script src="/static/scripts/nav.js"></script>
    <script src="/static/scripts/play.js"></script>
    <script src="/static/scripts/singleplayer_socket.js"></script>
</body>

</html>
