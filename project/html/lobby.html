<!doctype html>
<html lang="en" class="h-100">
  <head>
    <title>MemeMory</title>

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl"
      crossorigin="anonymous"
    />

    <!--- Custom CSS-->
    <!--- identical to index.html --->
    <link rel="stylesheet" href="/static/styles/index.css" />
    <link rel="stylesheet" href="/static/styles/theme.css" />
    <link rel="stylesheet" href="/static/styles/lobby.css" />

    <!--- Icons --->
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="/static/images/favicon/favicon.ico"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.0/font/bootstrap-icons.css"
    />

    <!--- Font --->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="d-flex flex-column h-100">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-3">
          <div class="row displ-content">
            <div class="col-6">
              <div class="navbar-brand active">
                <a href="/">
                  <img
                    src="/static/images/logo.png"
                    alt="logo"
                    class="img-fluid logo"
                  />
                </a>
              </div>
            </div>
            <div class="col-6 text-end fw-light">
              <div class="d-flex text-light pl-xl-5">
                <div class="ms-auto profile-menu" id="profileMenu">
                  <button type="button" class="profile-trigger" id="profileTrigger" aria-haspopup="true" aria-expanded="false">
                    <span id="profileAvatar" class="mm-avatar sm"></span>
                    <span class="profile-name" id="username"></span>
                    <i class="bi bi-chevron-down profile-caret"></i>
                  </button>
                  <div class="profile-dropdown" id="profileDropdown" hidden>
                    <div class="profile-head">
                      <span id="profileAvatarLarge" class="mm-avatar"></span>
                      <div class="overflow-hidden">
                        <div class="profile-head-name" id="profileName"></div>
                        <div class="mm-muted small">Signed in</div>
                      </div>
                    </div>
                    <a href="/lobby" class="profile-item"><i class="bi bi-controller"></i> Play</a>
                    <a href="/home" class="profile-item"><i class="bi bi-trophy"></i> Scoreboard</a>
                    <a href="/user" class="profile-item"><i class="bi bi-bar-chart-line"></i> Profile</a>
                    <a href="/settings" class="profile-item"><i class="bi bi-gear"></i> Settings</a>
                    <div class="profile-divider"></div>
                    <button type="button" class="profile-item danger" id="logoutButton">
                      <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="lobby container py-3">
      <!--- Singleplayer: small cards on top --->
      <section class="mb-4">
        <div class="section-head">
          <h2 class="section-title">Singleplayer</h2>
        </div>
        <div class="bot-grid">
          <button type="button" class="bot-card bot-easy" onclick="playSingleplayer(0)">
            <img src="/static/images/avatar_easy_200.png" alt="" class="bot-avatar" />
            <span class="bot-text">
              <span class="bot-name">Easy</span>
            </span>
            <i class="bi bi-play-fill bot-play"></i>
          </button>
          <button type="button" class="bot-card bot-medium" onclick="playSingleplayer(1)">
            <img src="/static/images/avatar_medium_200.png" alt="" class="bot-avatar" />
            <span class="bot-text">
              <span class="bot-name">Medium</span>
            </span>
            <i class="bi bi-play-fill bot-play"></i>
          </button>
          <button type="button" class="bot-card bot-hard" onclick="playSingleplayer(2)">
            <img src="/static/images/avatar_hard_200.png" alt="" class="bot-avatar" />
            <span class="bot-text">
              <span class="bot-name">Hard</span>
            </span>
            <i class="bi bi-play-fill bot-play"></i>
          </button>
          <button type="button" class="bot-card bot-expert" onclick="playSingleplayer(3)">
            <img src="/static/images/avatar_expert_200.png" alt="" class="bot-avatar" />
            <span class="bot-text">
              <span class="bot-name">Expert</span>
            </span>
            <i class="bi bi-play-fill bot-play"></i>
          </button>
        </div>
      </section>

      <!--- Multiplayer: create / join and the list of games --->
      <section class="mp-section">
        <div class="section-head">
          <h2 class="section-title">Multiplayer</h2>
          <span id="lobbyStatus" class="mm-live">Live</span>
        </div>

        <div class="mp-create mm-card">
          <h3 class="mp-create-title">Create a new room</h3>
          <div id="gamePicker" class="game-picker">
            <button type="button" class="game-tile" data-game="memory">
              <svg class="game-icon" viewBox="0 0 48 48" aria-hidden="true">
                <defs>
                  <linearGradient id="mmIconFront" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#6aa8ff" />
                    <stop offset="1" stop-color="#2f6fd6" />
                  </linearGradient>
                  <linearGradient id="mmIconBack" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#303030" />
                    <stop offset="1" stop-color="#1c1c1c" />
                  </linearGradient>
                </defs>
                <!--- Face down card --->
                <g transform="rotate(-13 16 25)">
                  <rect x="5.5" y="10" width="21" height="29" rx="4" fill="url(#mmIconBack)" stroke="#3b82f6" stroke-width="1.4" />
                  <rect x="8.5" y="13" width="15" height="23" rx="2.5" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1" />
                  <text x="16" y="29.5" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="800" fill="#6aa8ff">?</text>
                </g>
                <!--- Face up card with a meme --->
                <g transform="rotate(10 31 24)">
                  <rect x="21" y="10" width="22" height="30" rx="4" fill="#000" opacity="0.3" transform="translate(1.2 1.6)" />
                  <rect x="20" y="8" width="22" height="30" rx="4" fill="url(#mmIconFront)" />
                  <rect x="23" y="11" width="16" height="14" rx="2.2" fill="#ffffff" fill-opacity="0.2" />
                  <circle cx="35.2" cy="14.8" r="2.2" fill="#ffe08a" />
                  <path d="M23 25 L28.4 17.6 L31.8 21.6 L34.2 19.2 L39 25 Z" fill="#ffffff" />
                  <rect x="24" y="28.5" width="14" height="2.2" rx="1.1" fill="#ffffff" fill-opacity="0.9" />
                  <rect x="24" y="32.5" width="9" height="2.2" rx="1.1" fill="#ffffff" fill-opacity="0.55" />
                </g>
              </svg>
              <span class="game-name">MemeMory</span>
            </button>
            <button type="button" class="game-tile" data-game="tictactoe">
              <svg class="game-icon" viewBox="0 0 48 48" aria-hidden="true">
                <!--- Board --->
                <rect x="3" y="3" width="42" height="42" rx="8" fill="#1e1e1e" stroke="#343434" stroke-width="1.2" />
                <path d="M17 8 V40 M31 8 V40 M8 17 H40 M8 31 H40" stroke="#3d3d3d" stroke-width="1.6" stroke-linecap="round" />
                <!--- Red pieces (dark red with a red ring) --->
                <circle cx="10" cy="10" r="5.4" fill="#3a131b" stroke="#e81932" stroke-width="1.6" />
                <circle cx="10" cy="10" r="2.4" fill="none" stroke="#e81932" stroke-opacity="0.45" stroke-width="1" />
                <circle cx="38" cy="38" r="3.6" fill="#3a131b" stroke="#e81932" stroke-width="1.5" />
                <circle cx="24" cy="38" r="2.6" fill="#3a131b" stroke="#e81932" stroke-width="1.3" />
                <!--- Navy pieces (light blue ring); the big one covers a smaller one --->
                <circle cx="24" cy="24" r="6" fill="#21212f" stroke="#a9c1e9" stroke-width="1.6" />
                <circle cx="24" cy="24" r="2.8" fill="none" stroke="#a9c1e9" stroke-opacity="0.45" stroke-width="1" />
                <circle cx="38" cy="10" r="3.2" fill="#21212f" stroke="#a9c1e9" stroke-width="1.4" />
                <!--- Shine --->
                <path d="M7 7.6 A4 4 0 0 1 11.6 6.2" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round" />
                <path d="M20.6 20.2 A4.6 4.6 0 0 1 26 19" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1" stroke-linecap="round" />
              </svg>
              <span class="game-name">Tic Tac Toe XL</span>
            </button>
          </div>
        </div>

        <div class="rooms mm-card mt-3">
          <div class="rooms-head">
            <div class="rooms-title">
              <span class="fw-semibold">Open games</span>
              <span id="roomCount" class="mm-muted small"></span>
            </div>
            <form id="joinForm" class="rooms-join">
              <input type="text" id="joinLobbyTag" class="mm-input" placeholder="Room code" aria-label="Join with a room code" maxlength="20" autocomplete="off" spellcheck="false" />
              <button id="joinGameButton" type="submit" class="mm-btn mm-btn-sm">
                Join <i class="bi bi-arrow-right"></i>
              </button>
            </form>
          </div>
          <div class="table-responsive">
            <table class="rooms-table">
              <thead>
                <tr>
                  <th class="game-col">Game</th>
                  <th>Room</th>
                  <th>Players</th>
                  <th class="d-none d-md-table-cell">Spectators</th>
                  <th>Status</th>
                  <th class="text-end"></th>
                </tr>
              </thead>
              <tbody id="roomList"></tbody>
            </table>
          </div>
          <div id="noRooms" class="rooms-empty">
            <i class="bi bi-door-open"></i>
            <p class="mb-1 fw-semibold">No open games right now</p>
            <p class="mm-muted small mb-3">Create a room and invite your friends with the code.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <div class="container-fluid py-1">
        <nav class="d-flex justify-content-center text-center">
          <div>
            <a
              class="nav-link text-light px-4 py-2"
              href="https://de.wikipedia.org/wiki/Impressum"
              >Impressum</a
            >
          </div>
          <div>
            <a
              class="nav-link text-light px-4 py-2"
              href="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
              >don't click</a
            >
          </div>
        </nav>
      </div>
    </footer>

    <!--- JavaScript --->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0"
      crossorigin="anonymous"
    ></script>
    <!--- Custom JS --->
    <script src="/static/scripts/avatar.js"></script>
    <script src="/static/scripts/ui.js"></script>
    <script src="/static/scripts/nav.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/static/scripts/lobby_socket.js"></script>
  </body>
</html>
