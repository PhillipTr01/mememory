<!doctype html>
<html lang="en" class="min-h-100">

<head>
    <title>Poker - MemeMory</title>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">

    <!--- Custom CSS-->
    <!--- identical to index.html --->
    <link rel="stylesheet" href="/static/styles/index.css">
    <link rel="stylesheet" href="/static/styles/theme.css">
    <link rel="stylesheet" href="/static/styles/room.css">
    <link rel="stylesheet" href="/static/styles/jackpot.css">
    <link rel="stylesheet" href="/static/styles/poker.css">

    <!--- Icons --->
    <link rel="shortcut icon" type="image/x-icon" href="/static/images/favicon/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.0/font/bootstrap-icons.css">

    <!--- Font --->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;800&display=swap" rel="stylesheet">
</head>

<body class="d-flex flex-column min-h-100 jackpot-theme">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid px-3">
                <div class="row displ-content">
                    <div class="col-6">
                        <div class="navbar-brand active">
                            <a href="/">
                                <img src="/static/images/logo.png" alt="logo" class="img-fluid logo">
                            </a>
                        </div>
                    </div>
                    <div class="col-6 d-flex justify-content-end align-items-center">
                        <button type="button" id="navBonus" class="nav-bonus ms-auto" hidden>🎁 <span id="navBonusText">Free coins</span></button>
                        <button type="button" id="navCoins" class="nav-coins" title="Your coins - click to pay out" hidden>🪙 <span id="navCoinsValue">-</span></button>
                        <div class="profile-menu" id="profileMenu">
                  <button type="button" class="profile-trigger" id="profileTrigger" aria-haspopup="true" aria-expanded="false">
                    <span id="profileAvatar" class="mm-avatar sm"></span>
                    <span class="profile-name" id="username"></span>
                    <i class="bi bi-chevron-down profile-caret"></i>
                  </button>
                  <div class="profile-dropdown" id="profileDropdown" hidden>
                    <div class="profile-head">
                      <span id="profileAvatarLarge" class="mm-avatar"></span>
                      <div class="overflow-hidden">
                        <div class="profile-head-name" id="profileName"></div>
                        <div class="mm-muted small">Signed in</div>
                      </div>
                    </div>
                    <a href="/lobby" class="profile-item"><i class="bi bi-controller"></i> Play</a>
                    <a href="/home" class="profile-item"><i class="bi bi-trophy"></i> Scoreboard</a>
                    <a href="/user" class="profile-item"><i class="bi bi-bar-chart-line"></i> Profile</a>
                    <a href="/settings" class="profile-item"><i class="bi bi-gear"></i> Settings</a>
                    <div class="profile-divider"></div>
                    <button type="button" class="profile-item danger" id="logoutButton">
                      <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                  </div>
                </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!--- Shown while the connection is lost --->
    <div id="connectionBanner" class="connection-banner" hidden>
        <span class="spinner"></span> Connection lost - reconnecting...
    </div>

    <main class="room-page">
        <div class="room-layout">
            <div class="room-main">
                <section class="mm-card pk-main">
                    <!--- Choice of the hidden games --->
                    <nav class="cs-nav" aria-label="Games">
                        <a href="./" class="cs-tab"><span class="cs-tab-icon">🪙</span><span class="cs-tab-label">Jackpot</span></a>
                        <a href="battles" class="cs-tab"><span class="cs-tab-icon">⚔️</span><span class="cs-tab-label">Case Battles</span></a>
                        <a href="poker" class="cs-tab active" aria-current="page"><span class="cs-tab-icon">🃏</span><span class="cs-tab-label">Poker</span></a>
                        <a href="blackjack" class="cs-tab"><span class="cs-tab-icon"><span class="bj-icon" aria-hidden="true">21</span></span><span class="cs-tab-label">Blackjack</span></a>
                    </nav>
                    <div class="jp-head">
                        <div>
                            <h1 class="jp-title">🃏 Poker <span class="mm-badge" id="pkBlinds"></span></h1>
                            <p id="pkStatus" class="jp-status" aria-live="polite"></p>
                        </div>
                    </div>

                    <!--- The table: 5 seats around the felt, the own seat at the bottom --->
                    <div class="pk-table-wrap">
                        <div id="pkTable" class="pk-table">
                            <div class="pk-felt">
                                <div id="pkBoard" class="pk-board"></div>
                                <div id="pkPot" class="pk-pot"></div>
                                <div id="pkResult" class="pk-result"></div>
                            </div>
                            <div id="pkSeats"></div>
                        </div>
                    </div>

                    <!--- What I can do --->
                    <div id="pkActions" class="pk-actions" hidden>
                        <div class="pk-action-buttons">
                            <button type="button" id="pkFold" class="mm-btn pk-fold">Fold</button>
                            <button type="button" id="pkCall" class="mm-btn">Check</button>
                            <button type="button" id="pkRaise" class="mm-btn mm-btn-primary">Raise</button>
                        </div>
                        <div id="pkRaiseBox" class="pk-raise">
                            <div class="pk-presets">
                                <button type="button" class="mm-btn mm-btn-sm" data-preset="min">Min</button>
                                <button type="button" class="mm-btn mm-btn-sm" data-preset="half">½ Pot</button>
                                <button type="button" class="mm-btn mm-btn-sm" data-preset="pot">Pot</button>
                                <button type="button" class="mm-btn mm-btn-sm" data-preset="max">All-in</button>
                            </div>
                            <input id="pkSlider" type="range" class="pk-slider" aria-label="Raise to">
                            <input id="pkAmount" type="number" class="mm-input pk-amount" inputmode="numeric" aria-label="Raise to">
                        </div>
                    </div>

                    <div id="pkSeatBar" class="pk-seatbar" hidden>
                        <span id="pkMyInfo" class="mm-muted small"></span>
                        <div class="pk-seatbar-buttons">
                            <button type="button" id="pkAddChips" class="mm-btn mm-btn-sm"><i class="bi bi-plus-circle"></i> Add chips</button>
                            <button type="button" id="pkStand" class="mm-btn mm-btn-sm"><i class="bi bi-box-arrow-up"></i> Stand up</button>
                        </div>
                    </div>
                </section>
            </div>

            <aside class="room-side">
                <div class="mm-card side-card jp-history-card">
                    <div class="side-head">
                        <span class="fw-semibold"><i class="bi bi-clock-history me-2"></i>Last hands</span>
                        <span id="pkViewers" class="mm-badge"></span>
                    </div>
                    <ol id="pkHistory" class="jp-history"></ol>
                    <p id="pkHistoryEmpty" class="jp-empty mm-muted">No hands yet - take a seat!</p>
                </div>

                <div class="mm-card chat-card">
                    <div class="chat-head">
                        <span class="fw-semibold"><i class="bi bi-chat-dots me-2"></i>Chat</span>
                    </div>
                    <div class="chat-body-wrap">
                        <div id="chat-content" class="chat-body" aria-live="polite"></div>
                        <div id="chat-empty" class="chat-empty">
                            <span>👋</span>
                            <p class="mb-0">No messages yet - say hi!</p>
                        </div>
                        <button type="button" id="newMessages" class="new-messages" hidden>
                            New messages <i class="bi bi-arrow-down"></i>
                        </button>
                    </div>
                    <p id="chat-error" class="chat-error" hidden></p>
                    <div class="chat-quick" aria-label="Quick emojis">
                        <button type="button" data-emoji="😂">😂</button>
                        <button type="button" data-emoji="🔥">🔥</button>
                        <button type="button" data-emoji="👏">👏</button>
                        <button type="button" data-emoji="😭">😭</button>
                        <button type="button" data-emoji="🤯">🤯</button>
                        <button type="button" data-emoji="💀">💀</button>
                        <button type="button" data-emoji="🤡">🤡</button>
                        <button type="button" data-emoji="GG">GG</button>
                    </div>
                    <form id="chat-form" class="chat-form" autocomplete="off">
                        <input id="chat-input" class="chat-input" type="text" maxlength="300"
                            placeholder="Write a message..." aria-label="Chat message">
                        <span id="chat-counter" class="chat-counter" hidden></span>
                        <button id="send-message-btn" type="submit" class="chat-send" aria-label="Send" disabled>
                            <i class="bi bi-arrow-up"></i>
                        </button>
                    </form>
                </div>
            </aside>
        </div>
    </main>

    <!--- JavaScript --->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous">
    </script>
    <!--- Custom JS --->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/static/scripts/avatar.js"></script>
    <script src="/static/scripts/ui.js"></script>
    <script src="/static/scripts/nav.js"></script>
    <script src="/static/scripts/poker.js"></script>
    <script src="/static/scripts/casino_wallet.js"></script>
    <script src="/static/scripts/chat.js"></script>
</body>

</html>
