<!doctype html>
<html lang="en" class="min-h-100">

<head>
    <title>MemeMory</title>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">

    <!--- Custom CSS-->
    <!--- identical to index.html --->
    <link rel="stylesheet" href="/static/styles/index.css">
    <link rel="stylesheet" href="/static/styles/play.css">

    <!--- Icons --->
    <link rel="shortcut icon" type="image/x-icon" href="/static/images/favicon/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.0/font/bootstrap-icons.css">

    <!--- Font --->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;800&display=swap" rel="stylesheet">
</head>

<body class="d-flex flex-column h-100">

    <div id="cardModal" class="modal" onclick="closeCardModal()">
        <span class="close">&times;</span>
        <img class="modal-content mx-auto" id="imgModal">
    </div>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid px-3">
                <div class="row displ-content">
                    <div class="col-12 col-sm-6 col-lg-4 order-1 order-sm-1 order-lg-1">
                        <div class="navbar-brand active">
                            <a href="/">
                                <img src="/static/images/logo.png" alt="logo" class="img-fluid logo">
                            </a>
                        </div>
                    </div>
                    <div class="col-12 col-lg-4 order-sm-3 order-2 order-lg-2 text-center pt-2 pb-3 pt-md-0 pb-md-0">
                        <button type="submit" id="surrenderButton"
                            class="form-control btn btn-outline-danger btn-lg fw-bold rounded max-width-300"
                            onclick="surrender()" disabled>Surrender</button>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-4 order-3 order-sm-2 order-lg-3 fw-light">
                        <div class="d-flex text-secondary pl-xl-5">
                            <div class="mx-auto ms-sm-auto me-sm-0">
                                <div id="gameIDdiv">
                                    <p id="gameID" class="m-0 pb-0 fs-4 pt-4 pt-sm-0" data-bs-toggle="popover"
                                        data-bs-placement="bottom" data-bs-content="copied" data-bs-container="body">
                                    </p>
                                    <p id="gameIDdescr" class="fs-7 p-0 m-0 text-center text-secondary">^ (click to copy) ^</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="pt-0 pt-md-3 pt-lg-5 h-100">
        <div class="container-fluid px-3 h-100">
            <div class="row h-100">
                <div class="col-12 col-lg-9 h-lg-100 p-1 m-0 order-2 order-lg-1">
                    <!--- Waiting room: shown until the host starts the game --->
                    <section id="waitingRoom" class="waiting-room text-light mx-auto my-3 p-4 rounded-3" hidden>
                        <p class="fs-2 text-center mb-1">Waiting room</p>
                        <p id="waitingText" class="text-center text-secondary mb-4"></p>

                        <div class="room-code-box rounded-3 p-3 mb-4 text-center">
                            <p class="text-secondary mb-1">Room code</p>
                            <p id="roomCode" class="room-code mb-3"></p>
                            <button type="button" id="copyCodeButton" class="btn btn-outline-info btn-sm m-1">
                                <i class="bi bi-clipboard pe-1"></i> Copy code
                            </button>
                            <button type="button" id="copyLinkButton" class="btn btn-outline-info btn-sm m-1">
                                <i class="bi bi-link-45deg pe-1"></i> Copy invite link
                            </button>
                        </div>

                        <p class="fs-5 mb-2">Players <span id="playerCount" class="text-secondary"></span></p>
                        <ul id="waitingPlayers" class="list-unstyled mb-4"></ul>

                        <!--- Only visible for the host --->
                        <div id="hostSettings" hidden>
                            <div class="d-flex flex-wrap align-items-center mb-3">
                                <label for="maxPlayersSelect" class="me-3">Max. players</label>
                                <select id="maxPlayersSelect" class="form-select form-select-sm bg-dark text-light w-auto"></select>
                            </div>
                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="publicSwitch">
                                <label class="form-check-label" for="publicSwitch">Show room in the public room list</label>
                            </div>
                            <button type="button" id="startButton" class="form-control btn btn-outline-success btn-lg rounded" disabled>
                                Start Game
                            </button>
                            <p id="startHint" class="text-secondary text-center small mt-2 mb-0"></p>
                        </div>
                    </section>

                    <div id="board" class="container-xxl p-0 m-0 h-100 mx-auto" hidden>
                        <div class="row row-cols-11 h-100 justify-content-center" id="memoryTable">
                        </div>
                    </div>
                </div>
                <div class="col-12 col-lg-3 h-lg-100 order-1 order-lg-2 d-flex flex-column p-0">
                    <div class="text-light fs-4 p-3 text-break w-100 max-width-500 mx-auto me-lg-0">
                        <!--- Scoreboard, filled by multiplayer_socket.js --->
                        <div id="playerList"></div>

                        <div class="mt-md-2">
                            <button type="submit" id="playButton"
                                class="form-control btn btn-outline-info btn-lg rounded " onclick="emitEndTurn();"
                                disabled hidden> End Turn
                            </button>
                        </div>
                        <div class="border border-light mt-3 mt-md-4">
                            <div class="chat">
                                <div class="d-flex flex-column" id="chat-content" aria-live="polite">
                                </div>
                                <p id="chat-error" class="chat-error text-warning px-2 m-0" hidden></p>
                                <form id="chat-form" class="d-flex bg-transparent p-2 border-top" autocomplete="off">
                                    <input id="chat-input" class="chat-input bg-transparent text-light flex-grow-1" type="text"
                                        maxlength="300" placeholder="type..." aria-label="Chat message">
                                    <button id="send-message-btn" type="submit" class="btn btn-link text-info p-0 ms-2 my-auto" aria-label="Send">
                                        <i class="bi bi-arrow-right-square"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!--- JavaScript --->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous">
    </script>
    <!--- Custom JS --->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/static/scripts/play.js"></script>
    <script src="/static/scripts/multiplayer_socket.js"></script>
</body>

</html>
