<!doctype html>
<html lang="en" class="min-h-100">

<head>
    <title>Slots - MemeMory</title>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">

    <!--- Custom CSS-->
    <!--- identical to index.html --->
    <link rel="stylesheet" href="/static/styles/index.css">
    <link rel="stylesheet" href="/static/styles/theme.css">
    <link rel="stylesheet" href="/static/styles/room.css">
    <link rel="stylesheet" href="/static/styles/jackpot.css">
    <link rel="stylesheet" href="/static/styles/slots.css">

    <!--- Icons --->
    <link rel="shortcut icon" type="image/x-icon" href="/static/images/favicon/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.0/font/bootstrap-icons.css">

    <!--- Font --->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;800&display=swap" rel="stylesheet">
</head>

<body class="d-flex flex-column min-h-100 jackpot-theme">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid px-3">
                <div class="row displ-content">
                    <div class="col-6">
                        <div class="navbar-brand active">
                            <!--- From the casino back to the lobby of the games --->
                            <a href="/lobby" title="To the lobby">
                                <img src="/static/images/logo.png" alt="logo" class="img-fluid logo">
                            </a>
                        </div>
                    </div>
                    <div class="col-6 d-flex justify-content-end align-items-center">
                        <button type="button" id="navBonus" class="nav-bonus ms-auto" hidden>🎁 <span id="navBonusText">Free coins</span></button>
                        <button type="button" id="navCoins" class="nav-coins" title="Your coins - click to pay out" hidden>🪙 <span id="navCoinsValue">-</span></button>
                        <div class="profile-menu" id="profileMenu">
                  <button type="button" class="profile-trigger" id="profileTrigger" aria-haspopup="true" aria-expanded="false">
                    <span id="profileAvatar" class="mm-avatar sm"></span>
                    <span class="profile-name" id="username"></span>
                    <i class="bi bi-chevron-down profile-caret"></i>
                  </button>
                  <div class="profile-dropdown" id="profileDropdown" hidden>
                    <div class="profile-head">
                      <span id="profileAvatarLarge" class="mm-avatar"></span>
                      <div class="overflow-hidden">
                        <div class="profile-head-name" id="profileName"></div>
                        <div class="mm-muted small">Signed in</div>
                      </div>
                    </div>
                    <a href="/lobby" class="profile-item"><i class="bi bi-controller"></i> Play</a>
                    <a href="/home" class="profile-item"><i class="bi bi-trophy"></i> Scoreboard</a>
                    <a href="/user" class="profile-item"><i class="bi bi-bar-chart-line"></i> Profile</a>
                    <a href="/settings" class="profile-item"><i class="bi bi-gear"></i> Settings</a>
                    <div class="profile-divider"></div>
                    <button type="button" class="profile-item danger" id="logoutButton">
                      <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                  </div>
                </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!--- Shown while the connection is lost --->
    <div id="connectionBanner" class="connection-banner" hidden>
        <span class="spinner"></span> Connection lost - reconnecting...
    </div>

    <main class="room-page">
        <div class="room-layout">
            <div class="room-main">
                <section class="mm-card sl-main">
                    <div class="jp-head">
                        <div>
                            <h1 class="jp-title" data-info="slots"><svg class="cs-title-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="8" width="44" height="32" rx="8" fill="#2a2a2a" /><rect x="2" y="8" width="44" height="32" rx="8" fill="none" stroke="#d4a017" stroke-width="2.5" /><rect x="7" y="13" width="10" height="22" rx="3" fill="#f5f5f4" /><rect x="19" y="13" width="10" height="22" rx="3" fill="#f5f5f4" /><rect x="31" y="13" width="10" height="22" rx="3" fill="#f5f5f4" /><text x="12" y="29" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="900" fill="#dc2626">7</text><path d="M23.2 21 Q24 17.5 26.5 17" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-linecap="round" /><path d="M23.2 21 Q24.5 19.5 25.6 21.4" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-linecap="round" /><circle cx="22.6" cy="25.2" r="2.6" fill="#dc2626" /><circle cx="26" cy="26.2" r="2.6" fill="#b91c1c" /><rect x="32.5" y="21" width="7" height="6" rx="1.3" fill="#d4a017" /><text x="36" y="25.6" text-anchor="middle" font-family="Poppins, sans-serif" font-size="3.6" font-weight="900" fill="#5a3a00">BAR</text><path d="M2 24 H46" stroke="#dc2626" stroke-width="1" opacity="0.55" /></svg> Slots <span class="mm-badge">9 lines</span></h1>
                        </div>
                        <button type="button" id="slPaytable" class="mm-btn mm-btn-sm"><i class="bi bi-list-ol"></i> Paytable</button>
                    </div>

                    <!--- The machine: 5 reels, 3 rows, the 9 lines drawn over it --->
                    <div class="sl-machine">
                        <div class="sl-line-numbers left" id="slNumbersLeft"></div>
                        <div class="sl-window">
                            <div id="slReels" class="sl-reels"></div>
                            <svg id="slLines" class="sl-lines" aria-hidden="true"></svg>
                            <!--- The bonus wheel and the big-win show (over the reels) --->
                            <div id="slStage" class="sl-stage" hidden></div>
                        </div>
                        <div class="sl-line-numbers right" id="slNumbersRight"></div>
                    </div>

                    <!--- The win of the last spin --->
                    <div id="slWinBar" class="sl-winbar" aria-live="polite">
                        <span id="slWinText" class="sl-win-text">Good luck!</span>
                        <span id="slWinDetail" class="sl-win-detail"></span>
                    </div>

                    <!--- Bet and spin --->
                    <div class="sl-controls">
                        <div class="sl-wallet">
                            <span class="sl-label">Your coins</span>
                            <span id="slCoins" class="sl-coins">-</span>
                        </div>
                        <div class="sl-bet">
                            <span class="sl-label">Bet per spin</span>
                            <div class="sl-bet-row">
                                <button type="button" class="sl-step" id="slLess" aria-label="Less">−</button>
                                <input id="slBet" class="mm-input sl-bet-input" type="number" min="10" max="1000" step="1" inputmode="numeric" aria-label="Bet per spin">
                                <button type="button" class="sl-step" id="slMore" aria-label="More">+</button>
                            </div>
                            <div class="sl-presets" id="slPresets"></div>
                        </div>
                        <button type="button" id="slSpin" class="sl-spin">
                            <svg class="sl-spin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
                            <span class="sl-spin-text">
                                <span class="sl-spin-label">Spin</span>
                                <span class="sl-spin-sub" id="slSpinSub">Space</span>
                            </span>
                        </button>
                    </div>
                </section>
            </div>

            <aside class="room-side">
                <div class="mm-card side-card jp-history-card">
                    <div class="side-head">
                        <span class="fw-semibold"><i class="bi bi-trophy me-2"></i>Last wins</span>
                    </div>
                    <ol id="slFeed" class="jp-history"></ol>
                    <p id="slFeedEmpty" class="jp-empty mm-muted" data-icon="🎰">No wins yet - spin the first one!</p>
                </div>
                <div class="mm-card chat-card">
                    <div class="chat-head">
                        <span class="fw-semibold"><i class="bi bi-chat-dots me-2"></i>Chat</span>
                        <div class="chat-online-wrap">
                            <button type="button" id="chatOnline" class="chat-online" aria-expanded="false" hidden></button>
                            <div id="chatOnlineList" class="chat-online-list" hidden></div>
                        </div>
                    </div>
                    <div class="chat-body-wrap">
                        <div id="chat-content" class="chat-body" aria-live="polite"></div>
                        <div id="chat-empty" class="chat-empty">
                            <span>👋</span>
                            <p class="mb-0">No messages yet - say hi!</p>
                        </div>
                        <button type="button" id="newMessages" class="new-messages" hidden>
                            New messages <i class="bi bi-arrow-down"></i>
                        </button>
                    </div>
                    <p id="chat-error" class="chat-error" hidden></p>
                    <div class="chat-quick" aria-label="Quick emojis">
                        <button type="button" data-emoji="😂">😂</button>
                        <button type="button" data-emoji="🔥">🔥</button>
                        <button type="button" data-emoji="👏">👏</button>
                        <button type="button" data-emoji="😭">😭</button>
                        <button type="button" data-emoji="🤯">🤯</button>
                        <button type="button" data-emoji="💀">💀</button>
                        <button type="button" data-emoji="🤡">🤡</button>
                        <button type="button" data-emoji="GG">GG</button>
                    </div>
                    <form id="chat-form" class="chat-form" autocomplete="off">
                        <input id="chat-input" class="chat-input" type="text" maxlength="300"
                            placeholder="Write a message..." aria-label="Chat message">
                        <span id="chat-counter" class="chat-counter" hidden></span>
                        <button id="send-message-btn" type="submit" class="chat-send" aria-label="Send" disabled>
                            <i class="bi bi-arrow-up"></i>
                        </button>
                    </form>
                </div>
            </aside>
        </div>
    </main>

    <!--- The games: a bar at the bottom, can be closed (see casino_dock.js) --->
    <div id="csDock" class="cs-dock">
        <button type="button" id="csDockToggle" class="cs-dock-toggle" aria-expanded="true" aria-controls="csDockBar">
            <span class="cs-dock-toggle-label">Games</span><svg class="cs-dock-chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 L6 8 L9.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <nav id="csDockBar" class="cs-dock-bar" aria-label="Games">
            <a href="./" class="cs-tab">
              <svg class="cs-dock-icon" viewBox="0 0 48 48" aria-hidden="true">
                <!--- A stack of coins and one big coin --->
                <ellipse cx="17" cy="37" rx="11" ry="4" fill="#9a6b12" />
                <rect x="6" y="29" width="22" height="8" fill="#b8860b" />
                <ellipse cx="17" cy="29" rx="11" ry="4" fill="#e0a92e" />
                <rect x="6" y="23" width="22" height="6" fill="#b8860b" />
                <ellipse cx="17" cy="23" rx="11" ry="4" fill="#f5c542" />
                <circle cx="31" cy="20" r="13" fill="#d4a017" />
                <circle cx="31" cy="20" r="10" fill="#f5c542" />
                <text x="31" y="25.5" text-anchor="middle" font-family="Poppins, sans-serif" font-size="14" font-weight="800" fill="#8a5a00">$</text>
              </svg>
              <span class="cs-dock-name">Jackpot</span>
            </a>
            <a href="battles" class="cs-tab">
              <svg class="cs-dock-icon" viewBox="0 0 48 48" aria-hidden="true">
                <!--- A case with two crossed swords over it --->
                <rect x="9" y="22" width="30" height="20" rx="4" fill="#6d28d9" />
                <rect x="9" y="22" width="30" height="7" rx="3" fill="#8b5cf6" />
                <rect x="21" y="26" width="6" height="7" rx="1.5" fill="#f5c542" />
                <g stroke-linecap="round">
                  <path d="M10 6 L30 26" stroke="#d1d5db" stroke-width="3.2" />
                  <path d="M38 6 L18 26" stroke="#d1d5db" stroke-width="3.2" />
                  <path d="M26 24 L32 18 M22 24 L16 18" stroke="#b8860b" stroke-width="3" />
                </g>
              </svg>
              <span class="cs-dock-name">Case Battles</span>
            </a>
            <a href="poker" class="cs-tab">
              <svg class="cs-dock-icon" viewBox="0 0 48 48" aria-hidden="true">
                <!--- Two cards fanned out and a chip --->
                <g transform="rotate(-12 18 26)">
                  <rect x="7" y="9" width="21" height="30" rx="3.5" fill="#f3f4f6" />
                  <text x="11" y="19" font-family="Poppins, sans-serif" font-size="9" font-weight="800" fill="#111">A</text>
                  <text x="17.5" y="32" text-anchor="middle" font-size="12" fill="#111">♠</text>
                </g>
                <g transform="rotate(10 30 24)">
                  <rect x="19" y="8" width="21" height="30" rx="3.5" fill="#fff" />
                  <text x="23" y="18" font-family="Poppins, sans-serif" font-size="9" font-weight="800" fill="#dc2626">K</text>
                  <text x="29.5" y="31" text-anchor="middle" font-size="12" fill="#dc2626">♥</text>
                </g>
                <circle cx="37" cy="38" r="7" fill="#dc2626" />
                <circle cx="37" cy="38" r="4.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="2.4 2" />
              </svg>
              <span class="cs-dock-name">Poker</span>
            </a>
            <a href="blackjack" class="cs-tab">
              <span class="cs-dock-icon cs-dock-21" aria-hidden="true"><span class="bj-icon">21</span></span>
              <span class="cs-dock-name">Blackjack</span>
            </a>
            <a href="slots" class="cs-tab active" aria-current="page">
              <svg class="cs-dock-icon" viewBox="0 0 48 48" aria-hidden="true">
                <!--- A slot machine: one big 7 in the window, a lever --->
                <path d="M11 13 Q11 6 18 6 H28 Q35 6 35 13 Z" fill="#dc2626" />
                <circle cx="23" cy="9.6" r="1.6" fill="#fff3b0" />
                <rect x="7" y="12" width="32" height="31" rx="6" fill="#d4a017" />
                <rect x="7" y="12" width="32" height="8" rx="4" fill="#f5c542" />
                <rect x="11" y="17" width="24" height="17" rx="4" fill="#1f1f1f" />
                <rect x="13" y="19" width="20" height="13" rx="2.5" fill="#fff" />
                <rect x="13" y="19" width="20" height="3" rx="1.5" fill="#e5e7eb" />
                <rect x="13" y="29" width="20" height="3" rx="1.5" fill="#e5e7eb" />
                <text x="23" y="30.4" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12.5" font-weight="900" fill="#dc2626">7</text>
                <rect x="14" y="37" width="18" height="3" rx="1.5" fill="#8a5a00" />
                <rect x="39" y="27" width="4" height="7" rx="1.5" fill="#b8860b" />
                <path d="M42 30 V15" stroke="#d1d5db" stroke-width="2.6" stroke-linecap="round" />
                <circle cx="42" cy="13" r="3.6" fill="#dc2626" />
                <circle cx="41" cy="12" r="1.1" fill="#fecaca" />
              </svg>
              <span class="cs-dock-name">Slots</span>
            </a>
            <a href="leaderboard" class="cs-tab">
              <svg class="cs-dock-icon" viewBox="0 0 48 48" aria-hidden="true">
                <!--- A trophy --->
                <path d="M14 8 H34 V20 Q34 30 24 30 Q14 30 14 20 Z" fill="#f5c542" />
                <path d="M14 11 H8 Q8 21 15 22 M34 11 H40 Q40 21 33 22" fill="none" stroke="#d4a017" stroke-width="2.6" />
                <rect x="21" y="29" width="6" height="6" fill="#d4a017" />
                <rect x="15" y="35" width="18" height="6" rx="2" fill="#8a5a00" />
                <path d="M24 12 L25.6 16 L29.8 16.2 L26.5 18.8 L27.6 22.8 L24 20.5 L20.4 22.8 L21.5 18.8 L18.2 16.2 L22.4 16 Z" fill="#fff7d6" />
              </svg>
              <span class="cs-dock-name">Leaderboard</span>
            </a>
        </nav>
    </div>

    <!--- JavaScript --->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous">
    </script>
    <!--- Custom JS --->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/static/scripts/avatar.js"></script>
    <script src="/static/scripts/ui.js"></script>
    <script src="/static/scripts/nav.js"></script>
    <script src="/static/scripts/casino_dock.js"></script>
    <script src="/static/scripts/casino_info.js"></script>
    <script src="/static/scripts/slots.js"></script>
    <script src="/static/scripts/casino_wallet.js"></script>
    <script src="/static/scripts/chat.js"></script>
</body>

</html>
